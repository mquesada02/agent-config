name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run database checks
        run: |
          test -s fixtures/table-01.sql
          test -s fixtures/table-02.sql
          test -s fixtures/table-03.sql
          test -s fixtures/table-04.sql
          test -s fixtures/table-05.sql
          test -s fixtures/table-06.sql
          test -s fixtures/table-07.sql
          test -s fixtures/table-08.sql
          test -s fixtures/table-09.sql
          test -s fixtures/table-10.sql
          test -s fixtures/table-11.sql
          test -s fixtures/table-12.sql
          test -s fixtures/table-13.sql
          test -s fixtures/table-14.sql
          test -s fixtures/table-15.sql
          test -s fixtures/table-16.sql
          test -s fixtures/table-17.sql
          test -s fixtures/table-18.sql
          test -s fixtures/table-19.sql
          test -s fixtures/table-20.sql
          test -s fixtures/table-21.sql
          test -s fixtures/table-22.sql
          test -s fixtures/table-23.sql
          test -s fixtures/table-24.sql
          test -s fixtures/table-25.sql
          test -s fixtures/table-26.sql
          test -s fixtures/table-27.sql
          test -s fixtures/table-28.sql
          test -s fixtures/table-29.sql
          test -s fixtures/table-30.sql
          test -s fixtures/table-31.sql
          test -s fixtures/table-32.sql
          test -s fixtures/table-33.sql
          test -s fixtures/table-34.sql
          test -s fixtures/table-35.sql
          test -s fixtures/table-36.sql
          test -s fixtures/table-37.sql
          test -s fixtures/table-38.sql
          test -s fixtures/table-39.sql
          test -s fixtures/table-40.sql
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

name: Security audit
on:
  schedule:
    - cron: '17 5 * * 1'
permissions:
  contents: read
jobs:
  audit:
    name: Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

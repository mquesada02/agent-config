name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Run unit tests
        run: pnpm test
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Run integration tests
        run: pnpm test:integration
  ci-passed:
    name: CI passed
    if: always()
    needs: [unit, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run suite alpha (fails if a test fails or none ran)
        run: pnpm test:suite alpha
      - name: Run suite bravo (fails if a test fails or none ran)
        run: pnpm test:suite bravo
      - name: Run suite charlie (fails if a test fails or none ran)
        run: pnpm test:suite charlie
      - name: Run suite delta (fails if a test fails or none ran)
        run: pnpm test:suite delta
      - name: Run suite echo (fails if a test fails or none ran)
        run: pnpm test:suite echo
      - name: Run suite foxtrot (fails if a test fails or none ran)
        run: pnpm test:suite foxtrot
      - name: Run suite golf (fails if a test fails or none ran)
        run: pnpm test:suite golf
      - name: Run suite hotel (fails if a test fails or none ran)
        run: pnpm test:suite hotel
      - name: Run suite india (fails if a test fails or none ran)
        run: pnpm test:suite india
      - name: Run suite juliet (fails if a test fails or none ran)
        run: pnpm test:suite juliet
      - name: Run suite kilo (fails if a test fails or none ran)
        run: pnpm test:suite kilo
  ci-passed:
    name: CI passed
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lockfile: ${{ steps.filter.outputs.lockfile }}
    steps:
      - name: Check out the repo
        if: github.event_name == 'push'
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - name: Detect lockfile changes
        id: filter
        uses: dorny/paths-filter@0123456789abcdef0123456789abcdef01234567 # v3.0.2
        with:
          filters: |
            lockfile:
              - 'pnpm-lock.yaml'
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run typecheck
        run: pnpm typecheck
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run unit tests
        run: pnpm test
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
  audit:
    name: Audit
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.lockfile == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, lint, typecheck, test, build, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

schema_version: "1.0"
name: setup-rerun
description: Seam 4 setup case. A re-run of `/sql setup` on a repo with an existing rules file and allowlist. Setup asks per changed key, keeps the hand-written comment and rule, and appends only the new rule.
tags: [setup, rerun]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    Run `/sql setup` on the repo in the current folder (the current folder is the repo root). The repo already has a rules file and an allowlist. Nobody can answer your questions, so use these answers. Confirm the detected tags as they are (the repo uses only `sql`, as the rules file says). Decline the formatter install. Keep the services `app-dev`. The repo has no pitfalls, so there is no candidate to keep. For every style key that differs from what the measurer finds, keep the current `indent` and change `keyword_case` to the measured value. Add this rule of my own: `Never build SQL with string concatenation.` Show me the diff, and then confirm it and write the files. In your final message, show the whole rules file as it was written in a code block, and give the setup report: the chosen formatter and the other tools that the detector found, the tags, the services and what was written.

schema_version: "1.0"
name: format-sql-file-safe-tool
description: Seam 4 format case with a safe tool. Claude formats the middle statement of a .sql file with the repo's prettier-plugin-sql through the detector and the runner, twice, and the second run changes nothing.
tags: [format, safe-tool, sql-file]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    In the file `reports.sql` (it is in the current folder, and the current folder is the repo root), run `/sql format` on line 3 only (the second statement). Change no other line. When the first run is done, copy the file to `first-run.sql` with the Write tool (Read the file, then Write the same text to the new path). Then run `/sql format` a second time on the same statement (its line range may have moved). In your final message, show the whole file as it was after the first run, in a code block, name the formatter and the other tools that the format report lists, and say whether the second run changed the file.

schema_version: "1.0"
name: format-pg-refused
description: Seam 4 format case for a refused pg rewrite. Claude formats a `+` chain that has a comment between its pieces, the script refuses, the file stays as it was, the report names the refusal, and the second run changes nothing.
tags: [format, written-style, pg]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    In the file `audit-store.ts` (it is in the current folder, and the current folder is the repo root), run `/sql format` on lines 7 to 9 only. Change no other line. Write the new SQL value to `new-value.sql` in the current folder (for the second run, to `new-value-2.sql`). When the first run is done, copy the file to `first-run.ts` with the Write tool (Read the file, then Write the same text to the new path). Then run `/sql format` a second time on the same statement. In your final message, show the whole file as it was after the first run, in a code block, name each string that became a template and each refused rewrite, and say whether the second run changed the file.

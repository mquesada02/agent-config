schema_version: "1.0"
name: general-format-mixed
description: Format reply for a repo with two engines (a `postgres` import in one file and a `mysql2` import in the other). The reply is the general part for the MySQL file first, then the PostgreSQL format report unchanged. The MySQL file is not edited. The PostgreSQL flow may write the PostgreSQL file.
tags: [format, general]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    Run `/sql format src/reports.ts src/profile.ts` on the two files `src/reports.ts` and `src/profile.ts` (they are in the current folder, and the current folder is the repo root). Do not change any file by hand.

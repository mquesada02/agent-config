schema_version: "1.0"
name: general-opt-mysql
description: General optimize report for a MySQL repo (a `mysql2` driver import in the file). The skill does not cover MySQL, so the report is a general part with GEN rules, and the run uses no extractor and no database.
tags: [optimize, static, general]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 20
  allowed_tools: [Skill, Read, Glob, Grep, Bash]
  prompt: |
    Run `/sql optimize src/reports.ts` on the file `src/reports.ts` (it is in the current folder). Do not change any file.

schema_version: "1.0"
name: format-keyword-position
description: Seam 4 format case with no safe tool. A template with an interpolation in a keyword position gets the written style, with the opaque word rule, twice, and the second run changes nothing.
tags: [format, written-style, keyword-position]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 16
  allowed_tools: [Skill, Read, Glob, Grep, Bash, Edit, Write]
  prompt: |
    In the file `rows-store.ts` (it is in the current folder), run `/sql format` on lines 9 to 11 only. Change no other line. When the first run is done, copy the file to `first-run.ts` with `cp`. Then run `/sql format` a second time on the same template (its line range may have moved).

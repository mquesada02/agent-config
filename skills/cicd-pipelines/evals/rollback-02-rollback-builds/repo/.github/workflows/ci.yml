name: CI
on:
  pull_request:
  workflow_call:
    outputs:
      code:
        description: Whether the push changed code
        value: ${{ jobs.changes.outputs.code }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out the repo
        if: github.event_name != 'pull_request'
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@0123456789abcdef0123456789abcdef01234567 # v3.0.2
        with:
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - name: Set up Node
        uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Upload the build output
        uses: actions/upload-artifact@0123456789abcdef0123456789abcdef01234567 # v4.6.2
        with:
          name: dist
          path: dist
  ci-passed:
    name: CI passed
    if: always()
    needs: [changes, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - name: Check job results
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'

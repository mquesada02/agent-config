name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Create the release App token
        id: app-token
        uses: actions/create-github-app-token@0123456789abcdef0123456789abcdef01234567 # v2.0.6
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Check out the repo
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - name: Set up Node
        uses: actions/setup-node@0123456789abcdef0123456789abcdef01234567 # v5.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Publish the package
        run: npm publish

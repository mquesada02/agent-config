name: Rollback
run-name: Rollback prod to ${{ inputs.version }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to roll back to
        type: string
permissions: {}
jobs:
  rollback:
    name: Roll back
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the version
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0123456789abcdef0123456789abcdef01234567 # v4.1.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Assume the prod role
        uses: aws-actions/configure-aws-credentials@0123456789abcdef0123456789abcdef01234567 # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PROD }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy the build
        env:
          BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          SHA: ${{ github.sha }}
          FUNCTION: ${{ vars.FUNCTION_NAME }}
          VERSION_URL: ${{ vars.VERSION_URL }}
        run: ./scripts/deploy-lambda.sh "$BUCKET" "$SHA" "$FUNCTION" "$VERSION_URL"

name: Rollback
run-name: Rollback ${{ inputs.environment }} to ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to roll back
        type: choice
        options: [staging, prod]
permissions: {}
jobs:
  rollback:
    name: Roll back
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tag
        uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tag is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Assume the environment role
        uses: aws-actions/configure-aws-credentials@0123456789abcdef0123456789abcdef01234567 # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy the stack of the tag
        env:
          STACK: ${{ vars.STACK_NAME }}
        run: aws cloudformation deploy --stack-name "$STACK" --template-file infra/stack.yml --disable-rollback
